<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site editor</title>
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<header>
  <h1>Site editor</h1>
  <p>Fill in what you want. Leave anything blank and it simply won’t show on the site. When you’re done, press the red button, unzip the file it gives you, and copy its contents over your site folder (say yes to replace).</p>
  <button class="main" id="zip">Download update pack (zip)</button><button id="copy">Copy AI prompt</button><button id="clr">Hide everything still in [brackets]</button>
  <details><summary>Paste what an AI gave you back</summary><textarea id="imp" placeholder="Paste the JSON here"></textarea><br><button id="load">Load into form</button></details>
  <div id="msg" role="status"></div>
</header>
<main id="app"></main>
<script src="content.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
